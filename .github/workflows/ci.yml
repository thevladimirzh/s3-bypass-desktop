name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # M2-10 / strategy D-4 (board task; m2-test-plan §7): stage the
      # PINNED core binary so tests/unit/core-supervisor-real.test.ts can
      # spawn the REAL engine — the fake-core suites prove the mechanics,
      # this suite proves the pinned binary boots the materialized T.
      # prepare:core verifies every asset against core-pin.md (M2-04) and
      # needs `unzip` (present on both runners). DV-53.
      - run: npm run prepare:core
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # M2-08 / issue #2 (M1 security review S5-13): the PRODUCTION
      # tree audit is a BLOCKING gate — zero advisories may reach the
      # shipped dependency set (react/react-dom today). Pinned by
      # TC-PKG-16: this step must never carry continue-on-error.
      - run: npm audit --omit=dev

      # M2-08 / issue #2: the informational dev-chain audit the issue
      # calls optional, made real. NON-BLOCKING by contract ("non-
      # blocking informational leg"): highs in the dev-only packaging
      # chain (electron-builder and friends — see
      # docs/qa/security-m2-audit.md) report but never redden CI.
      - run: npm audit --audit-level=high
        continue-on-error: true

  # M2-07 / G-05: the coverage gate lands here after the authoritative
  # number was measured first (84.59% lines, full suite, probe run
  # 37711514257 — m2-test-plan §10/DV-43) >= thresholds.lines 80.
  # M2-10 / DV-53 re-measured WITH the real-binary suite included:
  # 85.23% lines (84.49% stmts / 73.17% branch / 87.2% funcs), run
  # 37760697553 — the comment tracks the CURRENT authoritative number.
  coverage:
    name: coverage (>=80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # M2-10 / DV-53: the real-binary integration rows (§7) run under
      # coverage too — the pinned binary must be staged first (same as
      # the checks job above).
      - run: npm run prepare:core
      - run: npm run test:coverage

  # M2-07 / docs/qa/e2e-ci-proposal.md rollout #1: the macOS leg first
  # (locally verified environment, DV-31). The Linux leg lands in its own
  # batch behind the keyring/safeStorage verification the proposal
  # prescribes (R-5) — TC-PKG-13 pins its absence until then. Do NOT skip
  # the Electron binary download in this job: it needs the real binary
  # (only PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD is set below).
  e2e:
    name: e2e smoke (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # _electron drives the local Electron binary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Port preflight (suite also fails loudly on a held port)
        run: node -e 'const s=require("node:net").connect({port:10808,host:"127.0.0.1"});s.on("connect",()=>{console.error("127.0.0.1:10808 held on runner");process.exit(1)});s.on("error",()=>process.exit(0))'
      - name: Smoke E2E (macOS)
        run: npm run test:e2e
