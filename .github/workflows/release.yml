name: Release

# M2-07 (board Phase D, DoD #1): pushing a vX.Y.Z tag builds the artifacts
# on both target platforms, re-verifies the pinned core digests at build
# time (npm run prepare:core — docs/analysis/core-pin.md), writes AND
# re-verifies release/SHA256SUMS.txt (npm run release:manifest), then
# uploads the artifacts + manifest. Publishing to a GitHub Release is NOT
# part of this workflow (acceptance keeps distribution a manual step).
#
# M2-07 follow-up (owner request 2026-10-08, DV-47 / TC-PKG-15): the
# Debian and RPM ecosystems are split — .deb/.AppImage stay on ubuntu-latest
# (native Debian tooling) and the .rpm is built where rpmbuild is NATIVE, in
# a pinned Fedora container. GitHub hosts no Fedora runners, so that job
# runs on ubuntu-latest inside `container:`. Per-leg `--linux <targets>`
# lists override electron-builder.yml's target list for one run — the yml
# itself stays untouched (TC-PKG-06 pins remain).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # issue #27 (M3 batch F): BOTH arches in one leg — arm64 (the
            # M2 waived default) and x64 (Intel users had no artifact at
            # all). electron-builder suffixes ${arch} into the dmg name, so
            # release/*.dmg catches both; the verify step below fails the
            # leg if either arch never staged.
            dist_args: --arm64 --x64
            paths: |
              release/*.dmg
              release/SHA256SUMS.txt
          - os: ubuntu-latest
            dist_args: --linux AppImage deb
            paths: |
              release/*.AppImage
              release/*.deb
              release/SHA256SUMS.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage the pinned core (SHA-256 verified against docs/analysis/core-pin.md — DoD #1)
        run: npm run prepare:core
      - name: Build the app (electron-vite — the out/ dir must exist on a fresh runner)
        run: npm run build
      - name: Build artifacts (electron-builder)
        # --publish never: on a tag electron-builder implicitly publishes
        # to a GitHub Release (needs GH_TOKEN) — this workflow uploads
        # artifacts itself, publishing stays manual (BRIEF/acceptance).
        # matrix.dist_args selects this leg's targets (DV-47): dmg only on
        # macOS, AppImage + deb on ubuntu — the rpm leg lives in the
        # build-rpm job below.
        run: npm run dist -- --publish never ${{ matrix.dist_args }}
      # issue #27 (TC-PKG-21): one matching dmg would still upload fine —
      # this assertion sees a silently skipped arch. Unquoted so word
      # splitting strips wc's padding; no-match -> 0 -> the test fails.
      - name: Verify both mac arch dmgs staged (issue #27)
        if: runner.os == 'macOS'
        run: test $(ls release/*.dmg | wc -l) -ge 2
      - name: SHA-256 manifest — written then re-verified (DoD #1)
        run: npm run release:manifest -- release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ runner.os }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # M2-07 follow-up (owner request 2026-10-08, DV-47): the rpm leg runs in
  # a PINNED Fedora container — native rpmbuild instead of Debian's rpm
  # package. `fedora:46` = Docker Hub's current stable on 2026-10-08 (pin
  # the MAJOR, never `latest`).
  build-rpm:
    name: build rpm (fedora container)
    runs-on: ubuntu-latest
    container:
      image: fedora:46
    timeout-minutes: 45
    steps:
      # fedora-minimal ships none of these: git (actions/checkout),
      # rpm-build (electron-builder's rpm target = fpm → rpmbuild),
      # unzip (scripts/prepare-core.mjs spawnSyncs it), zstd (actions/cache
      # tar --zstd), libxcrypt-compat (Fedora ships only libcrypt.so.2 —
      # electron-builder's bundled fpm ruby links libcrypt.so.1 and dies
      # with exit 127 without the compat symlink, observed DV-50 on run
      # 37717025643). Installed BEFORE checkout — the order is pinned by
      # TC-PKG-15.
      - name: Native rpm tooling + git + unzip + libcrypt (fedora minimal)
        run: dnf -y install git rpm-build unzip zstd libxcrypt-compat
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage the pinned core (SHA-256 verified against docs/analysis/core-pin.md — DoD #1)
        run: npm run prepare:core
      - name: Build the app (electron-vite — the out/ dir must exist on a fresh runner)
        run: npm run build
      - name: Build rpm (electron-builder + native rpmbuild)
        run: npm run dist -- --publish never --linux rpm
      - name: SHA-256 manifest — written then re-verified (DoD #1)
        run: npm run release:manifest -- release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-fedora
          path: |
            release/*.rpm
            release/SHA256SUMS.txt
          if-no-files-found: error
