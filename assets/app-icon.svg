  <circle cx="512" cy="512" r="248" fill="none" stroke="#e8f1f8" stroke-width="64" />
  <path
    d="M192 512 H768"
    fill="none"
    stroke="#e8f1f8"
    stroke-width="72"
    stroke-linecap="round"
  />
  <path
    d="M664 400 L792 512 L664 624"
    fill="none"
    stroke="#7fd4c1"
