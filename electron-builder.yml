appId: io.github.thevladimirzh.s3-bypass-desktop
productName: S3 Bypass Desktop
directories:
  output: release
files:
  - out/**
  - package.json
# M2-05 (TC-PKG-05): pinned explicitly — the package ships the asar
# archive, never loose files (M1 finding S5-18 recommendation).
asar: true
npmRebuild: false
# M2-20 fix (issue #20 / M2-09 S6-1, DV-60): fail-closed pack gate —
# re-hashes the packed core against the prepare:core staging manifest and
# the pin doc (offline; STALE/STRAY/MISSING/DIGEST all throw → build fails).
afterPack: scripts/after-pack-verify.mjs
# M2-06 (TC-PKG-10): attributions packed into EVERY artifact — electron-
# builder concatenates this global list with the platform extraResources
# below (app-file matcher: global + platformSpecificBuildOptions), so it
# composes with the core entries instead of replacing them. Directory-level
# `from` copies the contents into Resources/licenses/ (DoD #4).
extraResources:
  - from: resources/licenses
    to: licenses
# M2-05 owner decisions (2026-10-08): the mac build is intentionally
# UNSIGNED (no Apple Developer account, BRIEF §10) and Linux ships
# AppImage + .deb + .rpm (BRIEF §9). The core pinned in
# docs/analysis/core-pin.md is staged by `npm run prepare:core` into
# core-bin/<target>/ and packed directory-level below: xray + geoip.dat +
# geosite.dat + LICENSE + README.md. The runtime resolver
# (src/main/core-binary-path.ts, TC-02-18) serves core/<platform>/xray;
# user instructions for the unsigned build live in
# docs/product/macos-gatekeeper.md (TC-PKG-07).
mac:
  category: public.app-category.utilities
  # M3-11 / TC-PKG-23: arch-explicit dmg name — electron-builder otherwise
  # drops the suffix for the default arch (the Intel dmg landed archless on
  # run 37848480103 while beta-setup.md promises -x64.dmg).
  artifactName: ${productName}-${version}-${arch}.dmg
  # Owner decision 2026-10-08 (BRIEF §10): no Apple Developer account —
  # declare the build unsigned instead of configuring a signing identity.
  identity: null
  # M3-07 (TC-POL-04): generated in-repo from assets/app-icon.svg by
  # `npm run build:icon` (scripts/build-icon.mjs, iconutil toolchain).
  icon: assets/icon.icns
  target:
    - dmg
  extraResources:
    - from: core-bin/darwin-${arch}
      to: core/darwin
linux:
  category: Network
  # M3-07 (TC-POL-04): generated in-repo from assets/app-icon.svg by
  # `npm run build:icon` (1024 px, >= 256 px per BRIEF §9).
  icon: assets/icon.png
  target:
    - AppImage
    - deb
    - rpm
  extraResources:
    - from: core-bin/linux-${arch}
      to: core/linux
